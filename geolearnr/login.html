<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Admin Login – GEOLEARNR</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Identity -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d1117, #1f2937);
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<div class="container" id="login-container">
    <div class="card shadow-lg mx-auto" style="max-width:420px">
        <div class="card-body text-center p-4">

            <img src="https://geolearnr.ch/images/Logo-No-Text.png"
                 width="50"
                 class="mb-3">

            <h4 class="mb-2">Admin Login</h4>
            <p class="text-muted mb-4">Melde dich mit deinem Google-Konto an</p>

            <!-- Google Button -->
            <div id="g_id_onload"
                 data-client_id="882122884872-lqc2utdp744cju280483c0qt9bmtns5m.apps.googleusercontent.com"
                 data-callback="handleGoogleLogin"
                 data-auto_prompt="false">
            </div>

            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>

            <div id="login-error" class="text-danger mt-3 d-none">
                Login fehlgeschlagen
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
function handleGoogleLogin(response) {

    fetch("/api.php?action=google_login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({
            credential: response.credential
        })
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === "success") {
            // 👉 nach Login direkt ins Admin
            // window.location.href = "https://geolearnr.ch";
            history.back();

        } else {
            document.getElementById("login-error").classList.remove("d-none");
        }
    })
    .catch(() => {
        document.getElementById("login-error").classList.remove("d-none");
    });
}
</script>

</body>
</html>
