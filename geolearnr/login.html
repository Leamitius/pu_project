<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login – GEOLEARNR</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Google Identity -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        body {
            min-height: 100vh;
            /* background: linear-gradient(135deg, #0d1117, #1f2937); */
            /* display: flex; */
            align-items: center;
            justify-content: center;
        }

        .google-btn-wrapper {
            max-width: 100%;
        }

        .google-btn-container {
            display: flex;
            justify-content: center;
        }


        .google-btn-wrapper>div {
            width: 100% !important;
            display: flex !important;
            justify-content: center;
        }

        .google-btn-wrapper iframe {
            width: 100% !important;
        }

        @media (max-width: 576px) {
            .card-body {
                padding: 2rem 1.5rem;
            }

            #google-signin-btn {
                transform: scale(1);
                transform-origin: center;
            }

            h4 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand d-flex align-items-center" href="https://geolearnr.ch">
                <img src="https://geolearnr.ch/images/Logo-No-Text.png" alt="Logo" width="30" height="30" class="me-2">
                GEOLEARNR
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">

                    <li class="nav-item">
                        <a class="nav-link" href="https://geolearnr.ch">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="https://geolearnr.ch/learnsets">Learnsets</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="https://geolearnr.ch/information">Info</a>
                    </li>

                    <!-- LOGIN / USER DROPDOWN -->
                    <li class="nav-item dropdown d-none" id="userDropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" role="button"
                            data-bs-toggle="dropdown">

                            <img id="navAvatar" class="rounded-circle me-2 d-none" width="32" height="32">

                            <span id="navUsername">User</span>
                        </a>

                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="https://geolearnr.ch/dashboard">My Learnsets</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item text-danger" href="#" onclick="logout()">Logout</a></li>
                        </ul>
                    </li>

                    <li class="nav-item" id="loginBtn">
                        <a class="nav-link" href="https://geolearnr.ch/login">Login</a>
                    </li>


                    <!-- LOGIN BUTTON -->
                    <li class="nav-item ms-3" id="loginBtn" style="display:none;">
                        <a class="btn btn-outline-light btn-sm" href="https://geolearnr.ch/login">Login</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <div class="container d-flex justify-content-center align-items-center" id="login-container" style="min-height: calc(100vh - 80px);">
        <div class="card shadow-lg mx-auto w-100" style="max-width:420px">
            <div class="card-body text-center p-4">

                <button class="btn btn-sm btn-outline-secondary position-absolute" style="top:15px; left:15px"
                    onclick="history.back()">
                    ← Back
                </button>


                <img src="https://geolearnr.ch/images/Logo-No-Text.png" width="50" class="mb-3">

                <h4 class="mb-2">Login</h4>
                <p class="text-muted mb-4">Sign in with your Google account</p>

                <!-- Google Button -->
                <div id="g_id_onload"
                    data-client_id="882122884872-lqc2utdp744cju280483c0qt9bmtns5m.apps.googleusercontent.com"
                    data-callback="handleGoogleLogin" data-auto_prompt="false">
                </div>

                <!-- Google Button Wrapper -->
                <div class="d-flex justify-content-center">
                    <div class="google-btn-container">
                        <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline"
                            data-text="signin_with" data-size="large" data-logo_alignment="left" data-width="80%"
                            id="google-signin-btn">
                        </div>

                    </div>

                </div>


                <div id="login-error" class="text-danger mt-3 d-none">
                    Login failed
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function handleGoogleLogin(response) {

            fetch("/api.php?action=google_login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify({
                    credential: response.credential
                })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        // 👉 nach Login direkt ins dashboard
                        // window.location.href = "https://geolearnr.ch";
                        window.location.replace(document.referrer || "/");

                    } else {
                        document.getElementById("login-error").classList.remove("d-none");
                    }
                })
                .catch(() => {
                    document.getElementById("login-error").classList.remove("d-none");
                });
        }
    </script>

</body>

</html>
