<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin – Geolearnr</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-4">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Admin Panel</h2>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modal-add-learnset">
                + Neues Learnset
            </button>
        </div>

        <!-- Learnset List -->
        <div id="learnset-list" class="list-group"></div>

    </div>

    <!-- ============================= -->
    <!-- ADD LEARNSET MODAL -->
    <!-- ============================= -->
    <div class="modal fade" id="modal-add-learnset" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Neues Learnset erstellen</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Titel</label>
                        <input id="title" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Beschreibung</label>
                        <textarea id="description" class="form-control" rows="3"></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
                    <button class="btn btn-success" onclick="createLearnset()">Erstellen</button>
                </div>

            </div>
        </div>
    </div>

    <!-- ============================= -->
    <!-- EDIT LEARNSET MODAL -->
    <!-- ============================= -->
    <div class="modal fade" id="modal-edit-learnset" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Learnset bearbeiten</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="edit-id">

                    <div class="mb-3">
                        <label class="form-label">Titel</label>
                        <input id="edit-title" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Beschreibung</label>
                        <textarea id="edit-description" class="form-control" rows="3"></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
                    <button class="btn btn-primary" onclick="saveLearnsetEdit()">Speichern</button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="admin.js"></script>
</body>

</html>
