<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Learnset bearbeiten</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-4">
        <button class="btn btn-secondary mb-3" onclick="history.back()">← Zurück</button>

        <h3 id="learnset-title"></h3>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>Fragen</h4>
            <button class="btn btn-success" onclick="showAddQuestionForm()">+ Frage hinzufügen</button>
        </div>

        <div id="question-list" class="list-group"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../learnset.js"></script>
</body>

</html>
