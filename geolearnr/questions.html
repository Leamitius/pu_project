<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>GEOLEARNR</title>
	<link rel="icon" type="image/png" href="../images/GEOLEARNR-Logo.png">

	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
	#minimap-container {
		position: fixed;
		bottom: 24px;
		right: 24px;
		width: 260px;
		height: 200px;
		border-radius: 16px;
		overflow: hidden;
		box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
		transition: width 0.15s ease 0.5s, height 0.15s ease 0.5s;
		z-index: 1000;
	}

	#minimap-container:hover {
		width: 520px;
		height: 400px;
		transition-delay: 0s;
	}

	#minimap {
		width: 100%;
		height: 100%;
	}

	.question-box {
		width: 100%;
		max-width: 600px;
		border-radius: 20px;
	}

	.analysis-card {
		border-radius: 12px;
		border: 1px solid #e5e5e5;
		padding: 16px;
		background: #fff;
	}

	.analysis-card img {
		max-width: 100%;
		border-radius: 8px;
		margin-top: 10px;
	}

	.analysis-answer {
		font-size: 0.95rem;
	}

	.analysis-wrong {
		color: #dc3545;
	}

	.analysis-correct {
		color: #198754;
	}
</style>

<body class="bg-light" style="overflow: hidden;">

	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="container">
			<a class="navbar-brand d-flex align-items-center" href="https://geolearnr.ch">
				<img src="https://geolearnr.ch/images/Logo-No-Text.png" alt="Logo" width="30" height="30"
					class="me-2">GEOLEARNR</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto">
					<li class="nav-item"><a class="nav-link" href="https://geolearnr.ch">Home</a></li>
					<li class="nav-item"><a class="nav-link" href="https://geolearnr.ch/learnsets">Learnsets</a></li>
					<li class="nav-item"><a class="nav-link" href="https://geolearnr.ch/information">Info</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<div id="resume-page" class="d-none container text-center mt-5">
		<h2>🧠 Fortschritt gefunden</h2>
		<p id="resume-info"></p>

		<button id="resume-btn" class="btn btn-primary m-2">
			▶️ Weitermachen
		</button>

		<button id="restart-btn" class="btn btn-outline-danger m-2">
			🔄 Neu starten
		</button>
	</div>

	<div class="container d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 56px);"
		id="quiz-page">
		<div class="card shadow-lg question-box">
			<div class="card-body text-center">
				<div id="progress-indicator" class="mb-2 fw-bold"></div>


				<h3 id="question-text" class="mb-3">Frage lädt...</h3>

				<img id="question-image" class="img-fluid rounded d-none mb-3" style="max-height: 250px;">

				<!-- FEEDBACK -->
				<div id="answer-feedback" class="fw-bold mb-3"></div>

				<div id="answer-text" class="fw-bold mb-3"></div>

				<!-- BUTTONS -->
				<div class="d-flex justify-content-center gap-2">
					<button id="submit-btn" class="btn btn-primary">
						Antwort abschicken
					</button>

					<button id="next-btn" class="btn btn-secondary d-none" onclick="nextQuestion()">
						Weiter
					</button>
				</div>

				<!-- END SCREEN -->
				<div id="end-screen" class="d-none">
					<h3 class="mt-3">🎉 Fertig!</h3>
					<p>Du hast alle Fragen beantwortet.</p>
					<a href="/learnsets" class="btn btn-success">Zurück zu den Learnsets</a>
				</div>

			</div>
		</div>
	</div>
	<div id="analysis-page" class="d-none container my-5">
		<h2 class="mb-4">📊 Auswertung</h2>

		<div id="analysis-summary" class="mb-5"></div>

		<div id="analysis-wrong-list" class="row g-4"></div>
	</div>


	<div id="minimap-container">
		<div id="minimap"></div>
	</div>

	<script src="../js/questions.js"></script>
	<script async
		src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBr5qBdwGAkn-sJRlvgewmETYU8obe4gtY&callback=initMap&v=weekly">
		</script>
</body>


</html>
