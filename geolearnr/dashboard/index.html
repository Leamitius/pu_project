<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>GEOLEARNR</title>
    <link rel="icon" type="image/png" href="https://geolearnr.ch/images/GEOLEARNR-Logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <script src="https://accounts.google.com/gsi/client" async defer></script>

</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand d-flex align-items-center" href="https://geolearnr.ch">
                <img src="https://geolearnr.ch/images/Logo-No-Text.png" alt="Logo" width="30" height="30" class="me-2">
                GEOLEARNR
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">

                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/learnsets">Learnsets</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/information">Info</a>
                    </li>

                    <!-- LOGIN / USER DROPDOWN -->
                    <li class="nav-item dropdown d-none" id="userDropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" role="button"
                            data-bs-toggle="dropdown">

                            <img id="navAvatar" class="rounded-circle me-2 d-none" width="32" height="32">

                            <span id="navUsername">User</span>
                        </a>

                                <ul class="dropdown-menu dropdown-menu-end">
                                    <li><a class="dropdown-item" href="/dashboard">My Learnsets</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item text-danger" href="#" onclick="logout()">Logout</a></li>
                        </ul>
                    </li>

                    <li class="nav-item" id="loginBtn">
                        <a class="nav-link" href="https://geolearnr.ch/login">Login</a>
                    </li>


                    <!-- LOGIN BUTTON -->
                    <li class="nav-item ms-3" id="loginBtn" style="display:none;">
                        <a class="btn btn-outline-light btn-sm" href="https://geolearnr.ch/login">Login</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>



    <div class="container mt-4 d-none" id="dashboard-content">
        <!-- DEIN GANZER BESTEHENDER ADMIN CODE -->



        <div class="container mt-4">

            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2>Dashboard</h2>
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modal-add-learnset">
                    + New Learnset
                </button>
            </div>

            <!-- Learnset List -->
            <div id="learnset-list" class="list-group"></div>

        </div>

        <!-- ============================= -->
        <!-- ADD LEARNSET MODAL -->
        <!-- ============================= -->
        <div class="modal fade" id="modal-add-learnset" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">Create New Learnset</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input id="title" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea id="description" class="form-control" rows="3"></textarea>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button class="btn btn-success" onclick="createLearnset()">Create</button>
                    </div>

                </div>
            </div>
        </div>

        <!-- ============================= -->
        <!-- EDIT LEARNSET MODAL -->
        <!-- ============================= -->
        <div class="modal fade" id="modal-edit-learnset" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">Edit Learnset</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <input type="hidden" id="edit-id">

                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input id="edit-title" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea id="edit-description" class="form-control" rows="3"></textarea>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button class="btn btn-primary" data-bs-dismiss="modal"
                            onclick="saveLearnsetEdit()">Save</button>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="dashboard.js"></script>
    <script src="https://geolearnr.ch/js/navbar.js"></script>
</body>

</html>
