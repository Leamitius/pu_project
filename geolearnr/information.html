<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lernsets</title>
    <link rel="icon" type="image/png" href="images/GEOLEARNR-Logo.png">


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">


  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="images/Logo-No-Text.png" alt="Logo" width="30" height="30" class="me-2">GEOLEARNR</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="learnsets">Learnsets</a></li>
          <li class="nav-item"><a class="nav-link" href="information">Info</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-5" id="lernsets">
    <h1 class="text-center mb-4">Inforamtion</h1>
    <h4 class="text-center mb-4">Here you can see all the Information shown in the Learnsets and Quizzes.</h4>

    <!-- LERNSETS -->
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Lernset 1</h5>
            <p class="card-text">Bollards</p>
            <button class="btn btn-primary" onclick="openQuiz('mathe')">
              Öffnen
            </button>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Lernset 2</h5>
            <p class="card-text">Poles</p>
            <button class="btn btn-primary" onclick="openQuiz('info')">
              Öffnen
            </button>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Lernset 3</h5>
            <p class="card-text">Russia 25K</p>
            <button class="btn btn-primary" onclick="openQuiz('geschichte')">
              Öffnen
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal fade" id="quizModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <ul class="list-group" id="quizList"></ul>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/information.js"></script>

</body>

</html>
