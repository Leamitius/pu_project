      cursor: pointer;
      user-select: none;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

<body class="bg-light">

  <!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="#">
   <img src="../Geolearnr/images2/Logo-No-Text.png"

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

<div class="container py-5 text-center">

  <h1 class="mb-4">Basics – Flashcards</h1>

  <!-- Flashcard -->
  <div id="card" class="card flashcard shadow mb-3" onclick="flipCard()">
    <div class="card-body" id="cardText">
      Loading...
    </div>
  </div>

  <!-- Progress -->
  <p class="mb-3">
    Card <span id="currentIndex">1</span> / <span id="totalCards">0</span>
  </p>

  <!-- Controls -->
  <div class="d-flex justify-content-center gap-2 flex-wrap">
    <button class="btn btn-secondary" onclick="prevCard()">← Prev</button>
    <button class="btn btn-primary" onclick="flipCard()">Flip</button>
    <button class="btn btn-secondary" onclick="nextCard()">Next →</button>
    <button class="btn btn-outline-dark" onclick="shuffleCards()">Shuffle</button>
  </div>

</div>

<script>
  // -----------------------
  // FLASHCARD DATA
  // -----------------------
  const flashcards = [
    { term: "Coverage", definition: "Countries where Google Street View exists" },
    { term: "Meta", definition: "A clue that helps identify location" },
    { term: "Road Lines", definition: "Used to identify countries by color & pattern" },
    { term: "Language", definition: "Written text that helps identify location" }
  ];

  let index = 0;
  let flipped = false;

  const cardText = document.getElementById("cardText");
  const currentIndex = document.getElementById("currentIndex");
  const totalCards = document.getElementById("totalCards");

  totalCards.textContent = flashcards.length;

  // -----------------------
  // FUNCTIONS
  // -----------------------
  function renderCard() {
    flipped = false;
    cardText.textContent = flashcards[index].term;
    currentIndex.textContent = index + 1;
  }

  function flipCard() {
    flipped = !flipped;
    cardText.textContent = flipped
      ? flashcards[index].definition
      : flashcards[index].term;
  }

  function nextCard() {
    index = (index + 1) % flashcards.length;
    renderCard();
  }

  function prevCard() {
    index = (index - 1 + flashcards.length) % flashcards.length;
    renderCard();
  }

  function shuffleCards() {
    for (let i = flashcards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
    }
    index = 0;
    renderCard();
  }

  // Initial render
  renderCard();
</script>

</body>
